<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | Smart Waste Reporting</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <span class="navbar-brand mb-0 h1">Admin Dashboard</span>
      <div>
        <span id="welcomeText" class="text-white me-3"></span>
        <button id="logoutBtn" class="btn btn-outline-light btn-sm">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container mt-4">

    <!-- Summary statistics -->
    <div class="row mb-4">
      <div class="col-md-3">
        <div class="card text-center">
          <div class="card-body">
            <h6 class="text-muted">Total Reports</h6>
            <h3 id="statTotal">0</h3>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card text-center border-warning">
          <div class="card-body">
            <h6 class="text-muted">Pending</h6>
            <h3 id="statPending">0</h3>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card text-center border-info">
          <div class="card-body">
            <h6 class="text-muted">In Progress</h6>
            <h3 id="statInProgress">0</h3>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card text-center border-success">
          <div class="card-body">
            <h6 class="text-muted">Resolved</h6>
            <h3 id="statResolved">0</h3>
          </div>
        </div>
      </div>
    </div>


<!-- Toggle between list view and map view -->
<div class="mb-3">
  <button id="showListBtn" class="btn btn-primary btn-sm">List View</button>
  <button id="showMapBtn" class="btn btn-outline-primary btn-sm">Map View</button>
</div>


   <!-- Filters -->
    <div class="row mb-3">
      <div class="col-md-4">
        <input type="text" id="searchInput" class="form-control" placeholder="Search description or location...">
      </div>
      <div class="col-md-4">
        <select id="statusFilter" class="form-select">
          <option value="">All Statuses</option>
          <option value="pending">Pending</option>
          <option value="in_progress">In Progress</option>
          <option value="resolved">Resolved</option>
        </select>
      </div>
      <div class="col-md-4">
        <select id="categoryFilter" class="form-select">
          <option value="">All Categories</option>
          <option value="Blocked Drain">Blocked Drain</option>
          <option value="Illegal Dumping">Illegal Dumping</option>
          <option value="Overflowing Bin">Overflowing Bin</option>
          <option value="Other">Other</option>
        </select>
      </div>
    </div>

    <!-- Reports list -->
    <div id="reportsList" class="row"></div>

<!-- Map container, hidden until "Map View" is clicked -->
<div id="mapView" class="d-none">
  <div id="reportsMap" style="height: 500px; border-radius: 14px; overflow: hidden;"></div>
</div>

  </div>

  <script src="/js/admin.js"></script>
</body>
</html>
