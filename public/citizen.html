<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Reports | Smart Waste Reporting</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <span class="navbar-brand mb-0 h1">Smart Waste Reporting</span>
      <div>
        <span id="welcomeText" class="text-white me-3"></span>
        <button id="logoutBtn" class="btn btn-outline-light btn-sm">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container mt-4">

    <div id="submit-error" class="alert alert-danger d-none"></div>
    <div id="submit-success" class="alert alert-success d-none"></div>

    <div class="card mb-5">
      <div class="card-body">
        <h4 class="card-title mb-3">Report an Issue</h4>
        <form id="reportForm">
          <div class="mb-3">
            <label class="form-label">Category</label>
            <select class="form-select" id="category" required>
              <option value="">Select a category</option>
              <option value="Blocked Drain">Blocked Drain</option>
              <option value="Illegal Dumping">Illegal Dumping</option>
              <option value="Overflowing Bin">Overflowing Bin</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" id="description" rows="3" required></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label">Location (area/landmark)</label>
            <input type="text" class="form-control" id="location" placeholder="e.g. Near Madina Market" required>
          </div>

          <div class="mb-3">
            <button type="button" id="getLocationBtn" class="btn btn-outline-secondary btn-sm">
              📍 Use My Current Location
            </button>
            <span id="coordsDisplay" class="text-muted ms-2"></span>
            <input type="hidden" id="latitude">
            <input type="hidden" id="longitude">
          </div>

          <div class="mb-3">
            <label class="form-label">Photo Evidence</label>
            <input type="file" class="form-control" id="photo" accept="image/*" required>
          </div>

          <button type="submit" class="btn btn-primary">Submit Report</button>
        </form>
      </div>
    </div>

    <h4 class="mb-3">My Submitted Reports</h4>
    <div id="reportsList" class="row"></div>

  </div>

  <script src="/js/citizen.js"></script>
</body>
</html>
