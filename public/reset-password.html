<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | Smart Waste Reporting</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <nav class="navbar navbar-dark">
    <div class="container">
      <span class="navbar-brand mb-0 h1">🌿 Smart Waste Reporting</span>
    </div>
  </nav>

  <div style="background-color: var(--bg-light); min-height: 90vh; padding-top: 60px;">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-5">

          <div class="auth-box">
            <h3 class="mb-3">Reset Your Password</h3>

            <div id="reset-error" class="alert alert-danger d-none"></div>
            <div id="reset-success" class="alert alert-success d-none"></div>

            <form id="resetForm">
              <div class="mb-3">
                <label class="form-label">New Password</label>
                <div class="password-wrapper">
                  <input type="password" class="form-control" id="newPassword" required>
                  <span class="password-toggle" id="toggleNewPassword">Show</span>
                </div>
                <div class="strength-meter">
                  <div class="strength-meter-fill" id="strengthFill"></div>
                </div>
                <div class="strength-label" id="strengthLabel"></div>
              </div>
              <button type="submit" class="btn btn-primary w-100">Reset Password</button>
            </form>

            <p class="mt-3 text-center">
              <a href="/index.html">← Back to login</a>
            </p>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script src="/js/reset-password.js"></script>
</body>
</html>
